<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كىتاب - قۇتادغۇبىلىك كىتابخانىسى</title>
  <link rel="stylesheet" href="theme.css?v=2">
  <style>
    .book-detail-page{max-width:1100px;margin:0 auto;padding:55px 20px 80px}
    .book-detail-top{display:grid;grid-template-columns:minmax(280px,390px) 1fr;gap:55px;align-items:start}
    .book-cover-box{background:var(--site-card);border:1px solid var(--site-border);border-radius:18px;padding:18px;box-shadow:0 10px 30px var(--site-shadow)}
    .book-cover-box img{display:block;width:100%;height:auto;border-radius:10px}
    .book-detail-info{background:var(--site-card);border:1px solid var(--site-border);border-radius:18px;padding:38px 34px;box-shadow:0 10px 30px var(--site-shadow)}
    .book-detail-info h1{margin:0 0 14px;color:var(--site-text);font-size:clamp(28px,4vw,44px);line-height:1.35}
    .book-author{font-size:20px;margin-bottom:30px;color:var(--site-text-soft)}
    .book-meta{display:grid;gap:0;border-top:1px solid var(--site-border)}
    .book-meta-row{display:grid;grid-template-columns:170px 1fr;gap:20px;padding:17px 0;border-bottom:1px solid var(--site-border)}
    .book-meta-label{font-weight:700;color:var(--site-text)}
    .book-meta-value{color:var(--site-text-soft)}
    .back-link{display:inline-flex;margin-bottom:28px;padding:12px 20px;border-radius:10px;background:var(--site-brown);color:#fff!important;text-decoration:none}
    .dynamic-book-description{margin-top:24px;padding-top:20px;border-top:1px solid var(--site-border)}
    .dynamic-book-description h2{margin:0 0 9px;font-size:20px;color:var(--site-text)}
    .dynamic-book-description p{margin:0;color:var(--site-text-soft);line-height:2}
    @media(max-width:760px){
      .book-detail-page{padding:35px 14px 60px}
      .book-detail-top{grid-template-columns:1fr;gap:25px}
      .book-cover-box{max-width:430px;margin:0 auto}
      .book-detail-info{padding:28px 20px}
      .book-meta-row{grid-template-columns:1fr;gap:5px}
    }
  </style>
  <link rel="stylesheet" href="shop.css?v=10">
</head>
<body data-dynamic-book="1">
  <main class="book-detail-page">
    <a class="back-link" href="javascript:history.back()">← كەينىگە قايتىش</a>
    <section class="book-detail-top">
      <div class="book-cover-box"><img src="" alt="" hidden></div>
      <div class="book-detail-info">
        <h1>كىتاب</h1>
        <div class="book-author">ئاپتورى: —</div>
        <div class="book-meta"></div>
        <section class="dynamic-book-description" hidden>
          <h2>كىتاب ھەققىدە</h2>
          <p></p>
        </section>
      </div>
    </section>
  </main>
  <script src="theme.js?v=2"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="catalog.js"></script>
  <script src="shop.js?v=11"></script>
</body>
</html>
