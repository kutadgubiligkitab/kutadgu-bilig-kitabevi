<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پارول يېڭىلاش - قۇتادغۇبىلىك كىتابخانىسى</title>
  <link rel="stylesheet" href="admin.css?v=4">
</head>
<body>
<div class="admin-shell">
  <header class="admin-topbar">
    <div class="admin-brand"><img src="kutadgu-logo.webp" alt="قۇتادغۇبىلىك لوگوسى" class="kutadgu-site-logo"><span class="kutadgu-brand-text">🔐 قۇتادغۇبىلىك — پارول يېڭىلاش</span></div>
    <div class="admin-top-actions">
      <a href="account.html">👤 ئەزالىق كىرىش</a>
      <a href="admin.html">Admin</a>
      <a href="index.html">🏠 تور بەت</a>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-card admin-login">
      <h1>🔑 يېڭى پارول بېكىتىش</h1>
      <div id="resetStatus" class="admin-status">Email دىكى پارول يېڭىلاش ئۇلانمىسى ئارقىلىق بۇ بەتكە كەلگەندىن كېيىن، يېڭى پارولىڭىزنى ئىككى قېتىم يېزىڭ.</div>

      <form id="resetPasswordForm" class="admin-form">
        <label class="admin-wide">
          <span>يېڭى پارول</span>
          <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <label class="admin-wide">
          <span>يېڭى پارولنى قايتا يېزىڭ</span>
          <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <button class="admin-primary admin-wide" id="savePasswordBtn" type="submit">💾 يېڭى پارولنى ساقلاش</button>
      </form>

      <p class="admin-help">پارول كەم دېگەندە 8 ھەرپ/بەلگە بولسۇن. پارولنى ھېچكىمگە ئەۋەتمەڭ.</p>
    </section>
  </main>
</div>

<script src="supabase-config.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="reset-password.js?v=2"></script>
</body>
</html>
