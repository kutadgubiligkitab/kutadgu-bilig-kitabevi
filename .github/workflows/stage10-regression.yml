name: Stage 10 regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KUTADGU_PREVIEW_URL: ${{ vars.KUTADGU_PREVIEW_URL }}
      KUTADGU_BASE_URL: ${{ vars.KUTADGU_BASE_URL }}
      KUTADGU_ADMIN_EMAIL: ${{ secrets.KUTADGU_ADMIN_EMAIL }}
      KUTADGU_ADMIN_PASSWORD: ${{ secrets.KUTADGU_ADMIN_PASSWORD }}
      KUTADGU_MEMBER_EMAIL: ${{ secrets.KUTADGU_MEMBER_EMAIL }}
      KUTADGU_MEMBER_PASSWORD: ${{ secrets.KUTADGU_MEMBER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve target URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-resolve-e2e-target.js
      - name: Serve PR checkout when Preview is not usable
        if: env.KUTADGU_USE_LOCAL_STATIC == '1'
        run: |
          node scripts/static-preview-server.js &
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:4173/" >/dev/null; then
              echo "[e2e-target] local checkout server ready host=127.0.0.1"
              exit 0
            fi
            sleep 1
          done
          echo "[e2e-target] local checkout server failed to start" >&2
          exit 1
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
