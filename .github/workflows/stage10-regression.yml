name: Stage 10 regression

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KUTADGU_PREVIEW_URL: ${{ vars.KUTADGU_PREVIEW_URL }}
      KUTADGU_BASE_URL: ${{ vars.KUTADGU_BASE_URL }}
      KUTADGU_ADMIN_EMAIL: ${{ secrets.KUTADGU_ADMIN_EMAIL }}
      KUTADGU_ADMIN_PASSWORD: ${{ secrets.KUTADGU_ADMIN_PASSWORD }}
      KUTADGU_MEMBER_EMAIL: ${{ secrets.KUTADGU_MEMBER_EMAIL }}
      KUTADGU_MEMBER_PASSWORD: ${{ secrets.KUTADGU_MEMBER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve target URL
        run: |
          if [ -n "$KUTADGU_PREVIEW_URL" ]; then
            echo "Using preview $KUTADGU_PREVIEW_URL"
          elif [ -n "$KUTADGU_BASE_URL" ]; then
            echo "Using KUTADGU_BASE_URL $KUTADGU_BASE_URL"
          else
            echo "KUTADGU_BASE_URL=https://kutadgu-bilig-kitab.vercel.app" >> "$GITHUB_ENV"
            echo "Using production (read-safe Playwright routes block catalog writes)"
          fi
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
