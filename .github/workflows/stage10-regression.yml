name: Stage 10 regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

# Normal pull requests use the checked-out candidate. Set the repository variable
# KUTADGU_E2E_PREVIEW to 1 to wait for a Vercel preview on pull_request runs.
# workflow_dispatch keeps its preview URL, base URL, or production default.
concurrency:
  group: stage10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check current asset pins
        run: node scripts/ci-asset-pin-preflight.js

  e2e-shard:
    name: e2e-shard
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    env:
      KUTADGU_PREVIEW_URL: ${{ vars.KUTADGU_PREVIEW_URL }}
      KUTADGU_BASE_URL: ${{ vars.KUTADGU_BASE_URL }}
      KUTADGU_E2E_PREVIEW: ${{ vars.KUTADGU_E2E_PREVIEW }}
      KUTADGU_ADMIN_EMAIL: ${{ secrets.KUTADGU_ADMIN_EMAIL }}
      KUTADGU_ADMIN_PASSWORD: ${{ secrets.KUTADGU_ADMIN_PASSWORD }}
      KUTADGU_MEMBER_EMAIL: ${{ secrets.KUTADGU_MEMBER_EMAIL }}
      KUTADGU_MEMBER_PASSWORD: ${{ secrets.KUTADGU_MEMBER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve target URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-resolve-e2e-target.js
      - name: Serve PR checkout when Preview is not usable
        if: env.KUTADGU_USE_LOCAL_STATIC == '1'
        run: |
          node scripts/static-preview-server.js &
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:4173/" >/dev/null; then
              echo "[e2e-target] local checkout server ready host=127.0.0.1"
              exit 0
            fi
            sleep 1
          done
          echo "[e2e-target] local checkout server failed to start" >&2
          exit 1
      - name: Run Playwright shard
        id: playwright
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Record shard result
        if: always()
        run: node scripts/ci-e2e-gate.js record --shard ${{ matrix.shard }} --total 2 --outcome "${{ steps.playwright.outcome }}"
      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}-result
          path: e2e-shard-result.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload shard failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download shard results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*-result
          path: shard-results
      - name: Require every shard
        env:
          NEEDS_RESULT: ${{ needs.e2e-shard.result }}
        run: node scripts/ci-e2e-gate.js check --dir shard-results --needs "$NEEDS_RESULT"
