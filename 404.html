<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>404 — بۇ بەت تېپىلمىدى</title>
  <link rel="stylesheet" href="/theme.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--site-bg, #f6f0e5);
      color: var(--site-text, #44352d);
      padding: 24px;
    }
    main {
      max-width: 28rem;
      width: 100%;
      text-align: center;
      background: var(--site-card, #fffdf9);
      border: 1px solid var(--site-border, #e8dccb);
      border-radius: 14px;
      box-shadow: 0 5px 20px var(--site-shadow, rgba(75, 51, 39, 0.08));
      padding: 32px 24px;
    }
    .code {
      margin: 0 0 12px;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
      color: var(--site-brown, #70503d);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.25rem;
      color: var(--site-brown-dark, #4b3327);
    }
    p {
      margin: 0 0 24px;
      color: var(--site-text-soft, #806f62);
      line-height: 1.7;
    }
    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--button-primary-bg, #70503d);
      color: var(--button-primary-text, #fff);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>بۇ بەت تېپىلمىدى</h1>
    <p>سىز ئىزدىگەن بەت مەۋجۇت ئەمەس ياكى يۆتكەلگەن بولۇشى مۇمكىن.</p>
    <a href="/">باش بەتكە قايتىش</a>
  </main>
</body>
</html>
