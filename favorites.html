<!DOCTYPE html><html lang="ug" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ياقتۇرغان كىتابلار - قۇتادغۇبىلىك كىتابخانىسى</title><link rel="stylesheet" href="theme.css?v=2"><link rel="stylesheet" href="shop.css?v=2"></head><body><main class="cart-page"><a class="back-link" href="index.html">← باش بەتكە قايتىش</a><h1 style="margin:25px 0">❤️ ياقتۇرغان كىتابلىرىم</h1><div id="favoritesList"></div></main><script src="theme.js?v=2"></script><script src="catalog.js"></script><script src="shop.js?v=2"></script><script>document.addEventListener('DOMContentLoaded',function(){const h=document.getElementById('favoritesList'),a=JSON.parse(localStorage.getItem('kutadgu-favorites-v1')||'[]'),c=window.KITAP_CATALOG||[],items=a.map(id=>c.find(x=>x.id===id)).filter(Boolean);h.innerHTML=items.length?'<div class="shop-grid">'+items.map(b=>`<article class="shop-mini-card"><button class="mini-heart" data-fav-id="${b.id}">♥</button><a href="${b.href}"><img src="${b.image}" alt="${b.title}" onerror="this.style.visibility='hidden'"><div class="shop-mini-title">${b.title}</div><div class="shop-mini-meta">${b.author}</div><div class="shop-mini-price">${b.price?b.price+' ₺':'باھا تېخى بېكىتىلمىگەن'}</div></a><button class="add-to-cart" data-cart-id="${b.id}" style="margin-top:8px">🛒 سېۋەتكە سېلىش</button></article>`).join('')+'</div>':'<div class="empty-state">❤️ ھازىرچە ياقتۇرغان كىتاب يوق.</div>';h.querySelectorAll('[data-cart-id]').forEach(b=>b.onclick=()=>window.kutadguShop.add(b.dataset.cartId));h.querySelectorAll('[data-fav-id]').forEach(b=>b.onclick=()=>{window.kutadguShop.toggleFav(b.dataset.favId);location.reload()})})</script></body></html>
