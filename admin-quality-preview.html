  <link rel="stylesheet" href="admin.css?v=9">

<body>

<div class="admin-shell">
  <header class="admin-topbar"><div class="admin-brand">Admin quality preview</div></header>
  <main class="admin-main">
    <section id="dashboardPanel">
      <div class="admin-filter-row">
        <select id="adminFilterQuality" aria-label="مەزمۇن سۈپىتى">
          <option value="">مەزمۇن سۈپىتى: ھەممىسى</option>
          <option value="missing_author">ئاپتور يوق / ئورۇنباسار</option>
          <option value="placeholder_cover">ئورۇنباسار مۇقاۋا</option>
          <option value="missing_description">چۈشەندۈرۈش يوق</option>
          <option value="missing_isbn">ISBN يوق</option>
          <option value="complete">تولۇق كىتابلار</option>
        </select>
      </div>
      <div id="adminBookList" class="admin-book-list"></div>
      <div id="adminPager" class="admin-pager"></div>
    </section>
  </main>
</div>
<div id="bookModal" class="admin-modal">
  <div class="admin-modal-card">
    <div class="admin-modal-head"><h2>يېڭى كىتاب</h2></div>
    <form id="bookForm" class="admin-form" data-save-mode="create">
      <div id="createDuplicateWarning" class="admin-status warn admin-wide">
        <strong id="createDuplicateMessage">بۇ نام ۋە ئاپتور بىلەن ئوخشاش كىتاب بار.</strong>
        <div id="createDuplicateMatches" class="admin-dup-list">
          <div class="admin-dup-match"><strong>id 2</strong><span>رومان كىتابى 2</span><span>ئاپتور ئىسمى</span><span>203 ₺</span><span>كۆرۈنىدۇ</span></div>
        </div>
        <label class="admin-check"><input id="createDuplicateConfirm" type="checkbox"><span>بۇ يېڭى كىتاب، داۋاملاشتۇرۇشنى جەزملەشتۈرىمەن</span></label>
      </div>
    </form>
  </div>
</div>
<section id="setupPanel" hidden></section>
<section id="loginPanel" hidden></section>
<script src="admin-book-quality.js?v=2"></script>
