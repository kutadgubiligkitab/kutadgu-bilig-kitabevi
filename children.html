<!DOCTYPE html>

<html dir="rtl" lang="ug">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>بالىلار كىتابلىرى - قۇتادغۇبىلىك كىتابخانىسى</title>
<style>

/* =========================
   UKIJ CJK FONT
========================= */

@font-face {
    font-family: "UKIJ CJK";
    src: url("UKIJCJK.woff2") format("woff2"), url("UKIJCJK.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}


/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    direction: rtl;
    scroll-behavior: smooth;
}

body {
    font-family: "UKIJ CJK", Arial, sans-serif;
    background: #f6f0e5;
    color: #44352d;
    line-height: 1.8;
}

a {
    text-decoration: none;
    color: inherit;
}


/* =========================
   HEADER
========================= */

header {
    height: 64px;

    background: #4b3327;
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;

    box-shadow: 0 3px 15px rgba(75,51,39,0.15);
}

.logo {
    color: white;
    text-decoration: none;

    font-size: 20px;
    font-weight: bold;
}

nav {
    display: flex;
    align-items: center;
    gap: 28px;
}

nav a {
    color: white;
    text-decoration: none;

    font-size: 15px;

    transition: 0.2s;
}

nav a:hover {
    color: #e2c98d;
}


/* =========================
   PAGE HEADER
========================= */

.page-header {
    text-align: center;

    padding: 60px 20px 40px;
}

.page-icon {
    font-size: 45px;
    margin-bottom: 10px;
}

.page-header h1 {
    color: #4b3327;

    font-size: 38px;
    font-weight: bold;

    margin-bottom: 8px;
}

.page-header p {
    color: #806f62;

    font-size: 15px;
}


/* =========================
   BOOK SECTION
========================= */

.books-section {
    width: 90%;
    max-width: 1200px;

    margin: 0 auto;

    padding-bottom: 90px;
}


/* =========================
   BOOK GRID
========================= */

.books-grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 24px;
}


/* =========================
   BOOK CARD
========================= */

.book-card {
    background: #fffdf9;

    border: 1px solid #e8dccb;

    border-radius: 14px;

    overflow: hidden;

    box-shadow:
        0 5px 18px rgba(75,51,39,0.07);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.book-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 12px 28px rgba(75,51,39,0.13);
}


/* =========================
   BOOK COVER
========================= */

.book-cover {
    display: block;

    width: 100%;
    height: 310px;

    background: #fbf8f2;

    overflow: hidden;
}

.book-cover img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    transition: transform 0.3s ease;
}

.book-card:hover .book-cover img {
    transform: scale(1.025);
}


/* =========================
   BOOK INFO
========================= */

.book-info {
    padding: 18px;

    text-align: center;
}

.book-title {
    color: #4b3327;

    font-size: 20px;
    font-weight: bold;

    margin-bottom: 5px;
}

.book-author {
    color: #806f62;

    font-size: 14px;

    margin-bottom: 10px;
}


/* =========================
   PRICE
========================= */

.price {
    color: #4b3327;

    font-size: 18px;
    font-weight: bold;

    margin-bottom: 13px;
}


/* =========================
   BUTTON
========================= */

.book-button {
    display: inline-block;

    background: #4b3327;
    color: white;

    padding: 8px 25px;

    border-radius: 7px;

    font-size: 13px;

    transition: 0.2s;
}

.book-button:hover {
    background: #70503d;
}


/* =========================
   BACK BUTTON
========================= */

.back-area {
    text-align: center;

    padding-bottom: 50px;
}

.back-button {
    display: inline-block;

    background: #70503d;
    color: white;

    padding: 11px 28px;

    border-radius: 8px;

    font-size: 14px;

    transition: 0.2s;
}

.back-button:hover {
    background: #4b3327;
}


/* =========================
   TABLET
========================= */

@media (max-width: 900px) {

    header {
        padding: 0 5%;
    }

    .books-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}


/* =========================
   PHONE
========================= */

@media (max-width: 600px) {

    header {
        height: auto;

        padding: 15px 4%;

        flex-direction: column;

        gap: 8px;
    }

    .logo {
        font-size: 18px;
    }

    nav {
        gap: 18px;
    }

    nav a {
        font-size: 13px;
    }

    .page-header {
        padding: 40px 15px 30px;
    }

    .page-icon {
        font-size: 40px;
    }

    .page-header h1 {
        font-size: 29px;
    }

    .page-header p {
        font-size: 13px;
    }

    .books-section {
        width: 94%;
        padding-bottom: 60px;
    }

    .books-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .book-cover {
        height: 240px;
    }

    .book-info {
        padding: 13px 10px 16px;
    }

    .book-title {
        font-size: 17px;
    }

    .book-author {
        font-size: 12px;
    }

    .price {
        font-size: 15px;
    }

    .book-button {
        padding: 7px 17px;
        font-size: 12px;
    }

}


/* =========================
   SMALL PHONE
========================= */

@media (max-width: 380px) {

    .books-grid {
        grid-template-columns: 1fr;
    }

    .book-cover {
        height: 300px;
    }

}

</style>
