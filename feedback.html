<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="/kutadgu-favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" type="image/png" href="/kutadgu-apple-touch-icon.png" sizes="180x180">
  <title>پىكىر ۋە تەكلىپ — قۇتادغۇبىلىك كىتابخانىسى</title>
  <meta name="description" content="ئەزالار توربەت ھەققىدە پىكىر يوللايدۇ. پىكىر پەقەت باشقۇرغۇچىغا كۆرۈنىدۇ.">
  <link rel="canonical" href="https://www.kutadgubilik.com/feedback">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="theme.css?v=9">
  <link rel="stylesheet" href="shop.css?v=60">
  <link rel="stylesheet" href="feedback.css?v=1">
  <link rel="stylesheet" href="mobile.css?v=28">
</head>
<body>
  <main class="trust-page feedback-page">
    <a class="back-link" href="/">← باش بەت</a>
    <h1>پىكىر ۋە تەكلىپ</h1>
    <p>توربەت ھەققىدىكى پىكىر پەقەت باشقۇرغۇچىغا كۆرۈنىدۇ.</p>
    <p id="feedbackStatus" class="feedback-status" role="status">ھېساب تەكشۈرۈلۈۋاتىدۇ.</p>
    <p id="feedbackInvite" hidden>
      <a class="feedback-link" href="/account.html">ھېسابىڭىزغا كىرىڭ</a>
      ·
      <a class="feedback-link" href="/account.html">يېڭى ئەزا بولۇڭ</a>
    </p>
    <form id="feedbackForm" hidden>
      <label for="feedbackBody">پىكىرىڭىز</label>
      <textarea id="feedbackBody" name="feedback" dir="auto" rows="6" maxlength="4000" autocomplete="off"></textarea>
      <p id="feedbackCount" class="feedback-count">0 / 2,000</p>
      <button id="feedbackSubmit" class="feedback-submit" type="submit">يوللاش</button>
    </form>
    <button id="feedbackRetry" class="feedback-retry" type="button" hidden>قايتا سىناش</button>
  </main>
  <footer class="site-footer"></footer>
  <script defer src="theme.js?v=5"></script>
  <script defer src="supabase-config.js?v=22"></script>
  <script defer src="legacy-id-utils.js?v=5"></script>
  <script defer src="public-header.js?v=5"></script>
  <script defer src="app-config.js?v=6"></script>
  <script defer src="kutadgu-volume-groups.js?v=2"></script>
  <script defer src="member.js?v=35"></script>
  <script defer src="feedback.js?v=3"></script>
  <script defer src="shop.js?v=180"></script>
  <script defer src="mobile.js?v=10"></script>
</body>
</html>
