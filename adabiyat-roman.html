.book-card {

}

.book-card:hover {
    transform: translateY(-5px);

}

.book-image {

    justify-content: center;

    overflow: hidden;
}

.book-image img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    transition: transform 0.3s ease;
}

.book-card:hover .book-image img {
    transform: scale(1.025);
}

========================= */

    transition: 0.2s;
}
